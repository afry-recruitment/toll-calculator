name: Toll Calculator Pipeline

on:
  push:
    branches: [ "master", "features/assignment" ]
  pull_request:
    branches: [ "master" ]

jobs:
  check:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run Backend tests
        run: cd Java && chmod +x gradlew && ./gradlew clean test && cd ..

      - name: Run Frontend tests
        run: cd Java/Frontend && chmod +x gradlew && ./gradlew clean test && cd ..