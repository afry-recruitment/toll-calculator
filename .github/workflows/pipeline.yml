name: Toll Calculator Pipeline

on:
  push:
    branches: [ "master", "features/assignment" ]
  pull_request:
    branches: [ "master" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Run tests
        run: cd Java && chmod +x gradlew && ./gradlew clean test
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          cache-dependency-path: ./Java/Frontend/package-lock.json
          node-version: 22.x
          cache: 'npm'
      - name: Install npm dependencies
        run: cd Java/Frontend && npm install
      - name: Run Frontend tests
        run: cd Java/Frontend && chmod +x gradlew && ./gradlew clean test