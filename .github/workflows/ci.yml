name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore locked dependencies
        run: dotnet restore TollCalculator.sln --locked-mode
      - name: Build
        run: dotnet build TollCalculator.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test TollCalculator.sln --configuration Release --no-build --no-restore
      - name: Check formatting
        if: runner.os == 'Linux'
        run: dotnet format TollCalculator.sln --verify-no-changes --no-restore
