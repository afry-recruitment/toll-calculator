apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: toll-stage

resources:
  - ../base
  - namespace.yaml

images:
  - name: toll-service
    # PLACEHOLDER: the deploy workflow sets the registry path and tag
    newName: ghcr.io/OWNER/REPO/toll-service
    newTag: latest

replicas:
  - name: toll-service
    count: 2

labels:
  - pairs:
      environment: stage
    includeSelectors: false

configMapGenerator:
  - name: toll-service-config
    envs:
      - app.env

secretGenerator:
  - name: toll-service-secrets
    envs:
      - secrets.env
