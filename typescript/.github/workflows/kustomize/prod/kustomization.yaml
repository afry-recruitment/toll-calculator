apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: toll-prod

resources:
  - ../base
  - namespace.yaml

images:
  - name: toll-service
    # PLACEHOLDER: the deploy workflow sets the registry path and tag
    newName: ghcr.io/OWNER/REPO/toll-service
    newTag: latest

replicas:
  - name: toll-service
    count: 3

labels:
  - pairs:
      environment: prod
    includeSelectors: false

configMapGenerator:
  - name: toll-service-config
    envs:
      - app.env

secretGenerator:
  - name: toll-service-secrets
    envs:
      - secrets.env

patches:
  - target:
      kind: Deployment
      name: toll-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 1Gi
